version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: centerspace_db
    ports:
      - ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    ports:
      - ${REDIS_PORT}
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: